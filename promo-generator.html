<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaveIt - Chrome Store Asset Generator</title>
  <style>
    body {
      background: #000;
      color: #f5fbee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }
    h1 {
      color: #BEFA4F;
      margin-bottom: 6px;
      text-shadow: 0 0 12px rgba(190, 250, 79, 0.5);
    }
    p {
      color: #9ea98f;
      margin-top: 0;
      font-size: 14px;
    }
    .asset-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .label {
      font-size: 13px;
      font-weight: 700;
      color: #BEFA4F;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    /* Promo 440x280 container */
    #promo-canvas {
      width: 440px;
      height: 280px;
      border: 1px solid rgba(190, 250, 79, 0.4);
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(190, 250, 79, 0.2);
    }
    .btn {
      background: #BEFA4F;
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 0 15px rgba(190, 250, 79, 0.4);
    }
    .btn:hover {
      background: #d4ff75;
      box-shadow: 0 0 22px rgba(190, 250, 79, 0.7);
    }
  </style>
</head>
<body>
  <h1>SaveIt Asset Generator</h1>
  <p>Generate exact-dimension graphics for your Chrome Web Store listing.</p>

  <div class="asset-section">
    <div class="label">Small Promo Tile (440 × 280 px)</div>
    <canvas id="promo-canvas" width="440" height="280"></canvas>
    <button class="btn" id="btn-download-promo">Download 440×280 Promo PNG</button>
  </div>

  <script>
    const canvas = document.getElementById("promo-canvas");
    const ctx = canvas.getContext("2d");

    const iconImg = new Image();
    iconImg.src = "icons/icon128.png";
    iconImg.onload = () => {
      // Background: Pure Black
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, 440, 280);

      // Subtle ambient neon radial glow
      const radial = ctx.createRadialGradient(220, 110, 10, 220, 110, 180);
      radial.addColorStop(0, "rgba(190, 250, 79, 0.18)");
      radial.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = radial;
      ctx.fillRect(0, 0, 440, 280);

      // Border glow
      ctx.strokeStyle = "rgba(190, 250, 79, 0.35)";
      ctx.lineWidth = 2;
      ctx.strokeRect(1, 1, 438, 278);

      // Draw Icon centered horizontally
      ctx.drawImage(iconImg, 220 - 45, 38, 90, 90);

      // Title: SaveIt
      ctx.font = "800 32px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillStyle = "#BEFA4F";
      ctx.textAlign = "center";
      ctx.shadowColor = "rgba(190, 250, 79, 0.7)";
      ctx.shadowBlur = 18;
      ctx.fillText("SaveIt", 220, 175);

      // Subtitle
      ctx.shadowBlur = 0;
      ctx.font = "600 14px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillStyle = "#f5fbee";
      ctx.fillText("Your Permanent Clipboard & Web Clipper", 220, 208);

      // Tagline pill
      ctx.font = "700 11px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillStyle = "#9ea98f";
      ctx.fillText("100% PRIVATE • LOCAL STORAGE • ⌘+SHIFT+S", 220, 238);
    };

    document.getElementById("btn-download-promo").addEventListener("click", () => {
      const a = document.createElement("a");
      a.download = "saveit-promo-440x280.png";
      a.href = canvas.toDataURL("image/png");
      a.click();
    });
  </script>
</body>
</html>
