<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SaveIt</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        <h1>SaveIt</h1>
      </div>
      <div class="header-actions">
        <button id="btn-theme" class="icon-btn" title="Toggle Light / Dark mode">
          <svg id="theme-icon-sun" class="theme-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg id="theme-icon-moon" class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button id="btn-paste" class="icon-btn" title="Save from clipboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
        </button>
        <button id="btn-auth" class="icon-btn" title="Account & Cloud Sync">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
        <button id="btn-add" class="icon-btn" title="Add new item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button id="btn-menu" class="icon-btn" title="More options">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
        </button>
      </div>
    </header>

    <!-- Dropdown menu -->
    <div id="dropdown-menu" class="dropdown-menu hidden">
      <button id="menu-dashboard" class="dropdown-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Open Dashboard
      </button>
      <div class="dropdown-divider"></div>
      <button id="menu-export" class="dropdown-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export All
      </button>
      <button id="menu-import" class="dropdown-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Import
      </button>
      <div class="dropdown-divider"></div>
      <button id="menu-clear" class="dropdown-item danger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        Clear All
      </button>
    </div>

    <!-- View Mode Switcher: My Saves vs Web Memory -->
    <div class="view-mode-bar">
      <button class="mode-tab-btn active" id="tab-saves" data-mode="saves">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        <span>My Saves</span>
      </button>
      <button class="mode-tab-btn" id="tab-memory" data-mode="memory">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3 3"/>
        </svg>
        <span>Web Memory</span>
      </button>
    </div>

    <!-- Top Toolbar: Count & Type Filters -->
    <div class="toolbar-row" id="saves-toolbar">
      <div id="count-bar" class="count-bar hidden">
        <span id="item-count"></span>
      </div>
      <div class="type-filter-group">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="favorite" title="Favorites">★ Favorites</button>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" placeholder="Search your saves..." />
    </div>

    <!-- Items List -->
    <div id="items-container" class="items-container">
      <!-- Items rendered by JS -->
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="empty-state hidden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
        <polyline points="17 21 17 13 7 13 7 21"/>
        <polyline points="7 3 7 8 15 8"/>
      </svg>
      <p>No saved items yet</p>
      <span>Select text, right-click → "Save to SaveIt"<br/>or press <kbd>⌘</kbd>+<kbd>⇧</kbd>+<kbd>S</kbd></span>
    </div>

    <!-- Edit Item Modal -->
    <div id="edit-modal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <h2>Edit Item</h2>
        <div class="form-group">
          <label for="edit-content">Content</label>
          <textarea id="edit-content" rows="5"></textarea>
        </div>
        <div class="form-group">
          <label for="edit-tags">Tags <span class="hint">(comma separated)</span></label>
          <input type="text" id="edit-tags" placeholder="e.g. work, ideas, research" />
        </div>
        <div class="modal-actions">
          <button id="edit-cancel" class="btn btn-secondary">Cancel</button>
          <button id="edit-save" class="btn btn-primary">Save Changes</button>
        </div>
      </div>
    </div>

    <!-- Add Item Modal -->
    <div id="add-modal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <h2>Add New Item</h2>
        <div class="form-group">
          <label for="add-content">Content</label>
          <textarea id="add-content" rows="4" placeholder="Paste or write content here..."></textarea>
        </div>
        <div class="form-group">
          <label for="add-tags">Tags <span class="hint">(comma separated)</span></label>
          <input type="text" id="add-tags" placeholder="e.g. work, ideas, research" />
        </div>
        <div class="modal-actions">
          <button id="modal-cancel" class="btn btn-secondary">Cancel</button>
          <button id="modal-save" class="btn btn-primary">Save</button>
        </div>
      </div>
    </div>

    <!-- Auth / Account Modal -->
    <div id="auth-modal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <h2 id="auth-modal-title">Cloud Sync & Account</h2>
        <div id="auth-logged-in-view" class="hidden">
          <div class="auth-status-card">
            <div class="auth-avatar">👤</div>
            <div class="auth-info">
              <div class="auth-user-email" id="auth-user-email">user@example.com</div>
              <div class="auth-sync-status" id="auth-sync-status">🟢 Synced with Firebase Cloud</div>
            </div>
          </div>
          <div class="modal-actions" style="margin-top: 16px;">
            <button id="btn-sync-now" class="btn btn-primary">Sync Now</button>
            <button id="btn-logout" class="btn btn-secondary">Log Out</button>
          </div>
        </div>
        <div id="auth-logged-out-view">
          <p class="auth-desc">Log in to sync your saved items across different Chrome profiles and computers.</p>
          <div class="form-group">
            <label for="auth-email-input">Email</label>
            <input type="email" id="auth-email-input" placeholder="you@example.com" />
          </div>
          <div class="form-group">
            <label for="auth-password-input">Password</label>
            <input type="password" id="auth-password-input" placeholder="••••••••" />
          </div>
          <div class="auth-toggle-row">
            <span id="auth-mode-text">Don't have an account? <a href="#" id="auth-toggle-mode" style="color:var(--neon);">Sign Up</a></span>
          </div>
          <div class="modal-actions">
            <button id="auth-modal-cancel" class="btn btn-secondary">Cancel</button>
            <button id="auth-submit-btn" class="btn btn-primary">Log In</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <input type="file" id="import-file" accept=".json" style="display:none" />
  <script src="../services/nlp-parser.js"></script>
  <script src="../services/memory-store.js"></script>
  <script src="../services/sync.js"></script>
  <script src="popup.js"></script>
</body>
</html>
